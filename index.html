<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a6b70"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>بوصلة العودة | جاهزون للانطلاق</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon-192.png"><style>
:root{--teal:#0a6b70;--teal2:#0d7f83;--blue:#0f5573;--blue2:#167da0;--green:#74aa45;--gold:#d8b66b;--ink:#073d53;--paper:#f4fbfc;--shadow:0 18px 48px rgba(5,50,66,.22)}
*{box-sizing:border-box}html{background:#eaf5f5}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,rgba(121,192,173,.18),transparent 28%),radial-gradient(circle at 85% 80%,rgba(16,92,119,.12),transparent 32%),#eaf5f5;color:var(--ink);direction:rtl}
.app-shell{width:100%;max-width:1100px;margin:0 auto;padding:14px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.topbar .brand{font-weight:800;color:var(--ink)}.topbar .hint{font-size:.86rem;color:#4e6f79}.install-btn,.reset-btn{appearance:none;border:1px solid rgba(10,107,112,.22);background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;box-shadow:0 8px 22px rgba(7,61,83,.08);font-weight:700}.install-btn[hidden]{display:none}
.scene{position:relative;width:100%;aspect-ratio:1055/1491;overflow:hidden;border-radius:28px;box-shadow:var(--shadow);background:#dcebed;isolation:isolate}.scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;z-index:6;border:1.5px solid transparent;border-radius:22px;background:transparent;cursor:pointer;color:transparent;touch-action:manipulation;transition:.22s ease}.hotspot:hover,.hotspot:focus-visible{border-color:rgba(255,255,255,.95);background:rgba(16,126,131,.10);box-shadow:0 0 0 3px rgba(14,122,129,.28),0 0 28px rgba(217,184,111,.72);outline:none}.hotspot:active{transform:scale(.985)}.hotspot.done::after{content:'✓';position:absolute;top:7px;left:7px;width:29px;height:29px;display:grid;place-items:center;border-radius:50%;color:white;background:linear-gradient(135deg,var(--green),var(--teal));border:2px solid rgba(255,255,255,.92);box-shadow:0 6px 16px rgba(7,61,83,.25);font-size:16px;font-weight:900}
.progress-cover{position:absolute;z-index:7;left:69%;top:49.2%;width:16.8%;min-height:3.8%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 5px;border-radius:16px;background:rgba(247,252,252,.84);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(10,107,112,.18);box-shadow:0 7px 18px rgba(7,61,83,.12);pointer-events:none}.progress-cover span:first-child{font-size:clamp(7px,1vw,12px);font-weight:700;color:#315b66;line-height:1.1}.progress-number{font-size:clamp(13px,2.3vw,26px);font-weight:900;color:var(--ink);direction:ltr}
.path-light{position:absolute;z-index:4;width:1.2%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);opacity:.18;transition:opacity .4s ease,box-shadow .4s ease,transform .4s ease}.path-light.on{opacity:1;background:#fff8d6;box-shadow:0 0 9px 4px rgba(255,219,128,.85),0 0 24px 8px rgba(20,160,153,.36);transform:scale(1.18)}
.compass-pulse{position:absolute;z-index:3;left:15.2%;top:28.6%;width:31.8%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(218,183,107,0);pointer-events:none}.scene.active .compass-pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(218,183,107,0);border-color:rgba(218,183,107,0)}50%{box-shadow:0 0 24px 5px rgba(218,183,107,.42);border-color:rgba(255,255,255,.48)}}
.toast{position:absolute;z-index:12;left:50%;bottom:3.2%;transform:translateX(-50%) translateY(20px);background:rgba(4,51,66,.92);color:white;padding:10px 14px;border-radius:999px;font-size:clamp(10px,1.6vw,14px);opacity:0;pointer-events:none;transition:.25s ease;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{width:min(92vw,560px);border:0;border-radius:26px;padding:0;background:rgba(249,253,253,.98);color:var(--ink);box-shadow:0 28px 80px rgba(4,46,62,.32)}dialog::backdrop{background:rgba(2,31,42,.58);backdrop-filter:blur(5px)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px 14px;border-bottom:1px solid rgba(10,107,112,.13);background:linear-gradient(135deg,rgba(10,107,112,.08),rgba(116,170,69,.08))}.modal-head h2{margin:0;font-size:1.2rem}.close-btn{appearance:none;border:0;background:rgba(7,61,83,.08);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px}.modal-body{padding:18px 20px 20px}.subtitle{margin:0 0 14px;color:#52717b;font-size:.95rem}.task-list{display:grid;gap:10px}.task-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid rgba(10,107,112,.14);border-radius:16px;background:white}.task-row input{width:20px;height:20px;accent-color:var(--teal)}
.goal-box{width:100%;min-height:120px;resize:vertical;border:1px solid rgba(10,107,112,.22);border-radius:16px;padding:12px;font:inherit;color:var(--ink);background:white}.action-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.primary,.secondary{appearance:none;border:0;border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:800}.primary{background:linear-gradient(135deg,var(--teal),var(--blue2));color:white}.secondary{background:#edf6f6;color:var(--ink);border:1px solid rgba(10,107,112,.14)}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.summary-card{border:1px solid rgba(10,107,112,.13);border-radius:16px;padding:13px;background:white}.summary-card strong{display:block;margin-bottom:3px}.meter{width:100%;height:10px;border-radius:999px;background:#e6efef;overflow:hidden;margin-top:7px}.meter>span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--teal),var(--blue2));width:0}.badge-award{display:none;margin-top:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(116,170,69,.13),rgba(216,182,107,.19));border:1px solid rgba(216,182,107,.38);text-align:center;font-weight:900}.badge-award.show{display:block}.challenge{padding:14px;border-radius:18px;border:1px solid rgba(10,107,112,.14);background:linear-gradient(135deg,rgba(15,125,160,.07),rgba(116,170,69,.08));line-height:1.8}.app-footer-note{text-align:center;color:#4c6a74;font-size:.84rem;margin:10px 0 4px}
@media(max-width:600px){.app-shell{padding:7px}.topbar{padding:2px 2px 4px}.topbar .hint{display:none}.scene{border-radius:18px}.install-btn,.reset-btn{padding:8px 10px;font-size:.82rem}.summary-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body><div class="app-shell"><div class="topbar"><div><div class="brand">بوصلة العودة</div><div class="hint">اضغط على بطاقات الاستعداد، البوصلة، أو أزرار التطبيق داخل التصميم.</div></div><div style="display:flex;gap:7px"><button id="installBtn" class="install-btn" type="button" hidden>تثبيت التطبيق</button><button id="resetBtn" class="reset-btn" type="button">بدء من جديد</button></div></div><main class="scene" aria-label="واجهة تطبيق بوصلة العودة التفاعلية"><img src="./assets/master.png" alt="التصميم الرئيسي لتطبيق بوصلة العودة"><div class="compass-pulse"></div>

<button class="hotspot" data-section="learn" aria-label="أنا مستعد للتعلم" style="left:28.8%;top:17%;width:26.6%;height:15%"></button>

<button class="hotspot" data-section="digital" aria-label="أنا مستعد رقميًا" style="left:39%;top:31%;width:16.4%;height:18.4%"></button>

<button class="hotspot" data-action="goal" aria-label="هدفي" style="left:62.7%;top:68.8%;width:27.3%;height:5%"></button>

<button class="hotspot" data-section="learn" aria-label="خطوة حقيبة جاهزة" style="left:16.2%;top:82.6%;width:11%;height:8%;border-radius:50%"></button>
<button class="hotspot" data-section="learn" aria-label="خطوة ذهن مستعد" style="left:29.2%;top:82.6%;width:11%;height:8%;border-radius:50%"></button>
<button class="hotspot" data-section="social" aria-label="خطوة علاقات إيجابية" style="left:42.4%;top:82.6%;width:11%;height:8%;border-radius:50%"></button>
<button class="hotspot" data-action="goal" aria-label="خطوة هدف واضح" style="left:55.3%;top:82.6%;width:11%;height:8%;border-radius:50%"></button>
<button class="hotspot" data-action="journey" aria-label="خطوة الانطلاق" style="left:68.5%;top:82.6%;width:11%;height:8%;border-radius:50%"></button>
<div id="toast" class="toast" aria-live="polite"></div></main><div class="app-footer-note">يحفظ التطبيق التقدم والهدف على الجهاز نفسه. عند رفع النسخة إلى رابط HTTPS يمكن تثبيتها كتطبيق PWA.</div></div><dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeBtn" class="close-btn" type="button" aria-label="إغلاق">×</button></div><div id="modalBody" class="modal-body"></div></dialog><script>
(()=>{
const KEY='bousalat_alawda_state_v1';
const sections={psych:{title:'أنا مستعد نفسيًا',subtitle:'اختر ما أنجزته لتبدأ العودة بثقة وهدوء.',tasks:['نوم منظم','تفاؤل','حماس']},learn:{title:'أنا مستعد للتعلّم',subtitle:'جهّز أدواتك وابدأ عامك بخطوات صغيرة واضحة.',tasks:['ترتيب الأدوات','مراجعة بسيطة','تنظيم الحقيبة']},social:{title:'أنا مستعد اجتماعيًا',subtitle:'العلاقة الطيبة جزء من بداية دراسية جميلة.',tasks:['احترام','تعاون','صداقة']},digital:{title:'أنا مستعد رقميًا',subtitle:'استعداد رقمي منظم وآمن قبل الانطلاق.',tasks:['المنصات التعليمية','الاستخدام الآمن','تنظيم الجهاز']}};
const challenges=['رتّب حقيبتك اليوم، وأزل منها أي شيء لا تحتاجه في أول يوم.','اكتب هدفًا واحدًا تريد أن تحققه خلال الأسابيع الأربعة الأولى.','جهّز مكانًا هادئًا للمذاكرة ورتّب أدواتك فيه.','اختر عادة صباحية صغيرة تساعدك على بدء يومك بنشاط.','اكتب كلمة لطيفة ستقولها لزميل أو زميلة في أول يوم.'];
let deferredPrompt=null;
const empty=()=>({checked:{},goal:'',challengeDone:false,challengeIndex:0});
function load(){try{return Object.assign(empty(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return empty()}} let state=load();
const scene=document.querySelector('.scene'),dlg=document.getElementById('modal'),mt=document.getElementById('modalTitle'),mb=document.getElementById('modalBody'),closeBtn=document.getElementById('closeBtn'),toast=document.getElementById('toast'),pn=document.getElementById('progressNumber'),lights=[...document.querySelectorAll('.path-light')],installBtn=document.getElementById('installBtn'),resetBtn=document.getElementById('resetBtn');
const tkey=(s,i)=>`${s}:${i}`; function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function progress(){let total=2,done=0;Object.keys(sections).forEach(k=>{total+=sections[k].tasks.length;sections[k].tasks.forEach((_,i)=>{if(state.checked[tkey(k,i)])done++})});if((state.goal||'').trim())done++;if(state.challengeDone)done++;return Math.round(done/total*100)}
function sectionDone(k){return sections[k].tasks.every((_,i)=>state.checked[tkey(k,i)])}
function toastMsg(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove('show'),2400)}
function save(){localStorage.setItem(KEY,JSON.stringify(state));update()}
function update(){const p=progress();pn.textContent=p+'%';lights.forEach((e,i)=>e.classList.toggle('on',p>=((i+1)/lights.length)*100-1));scene.classList.toggle('active',p>0&&p<100);document.querySelectorAll('.hotspot[data-section]').forEach(b=>b.classList.toggle('done',sectionDone(b.dataset.section)));document.querySelectorAll('[data-action="goal"]').forEach(b=>b.classList.toggle('done',!!(state.goal||'').trim()));document.querySelectorAll('[data-action="challenge"]').forEach(b=>b.classList.toggle('done',state.challengeDone));if(p===100)toastMsg('🎉 اكتملت جاهزيتك! استحققت وسام العودة المميزة.');}
function open(title,html){mt.textContent=title;mb.innerHTML=html;dlg.showModal()}
function renderSection(k){const s=sections[k];open(s.title,`<p class="subtitle">${s.subtitle}</p><div class="task-list">${s.tasks.map((t,i)=>`<label class="task-row"><input type="checkbox" data-task-key="${tkey(k,i)}" ${state.checked[tkey(k,i)]?'checked':''}><span>${t}</span></label>`).join('')}</div><div class="action-row"><button type="button" class="primary" data-modal-action="save-tasks">حفظ الإنجاز</button><button type="button" class="secondary" data-modal-action="close">إغلاق</button></div>`)}
function renderGoal(){open('هدفي هذا العام',`<p class="subtitle">اكتب هدفًا واحدًا واضحًا تريد تحقيقه هذا العام.</p><textarea class="goal-box" id="goalInput" placeholder="مثال: أرفع مستواي في الرياضيات وأحافظ على تنظيم وقتي.">${esc(state.goal||'')}</textarea><div class="action-row"><button type="button" class="primary" data-modal-action="save-goal">حفظ هدفي</button><button type="button" class="secondary" data-modal-action="close">إغلاق</button></div>`)}
function renderChallenge(){open('تحدي اليوم',`<div class="challenge">${challenges[state.challengeIndex%challenges.length]}</div><div class="action-row"><button type="button" class="primary" data-modal-action="challenge-done">${state.challengeDone?'تم الإنجاز ✓':'أنجزت التحدي'}</button><button type="button" class="secondary" data-modal-action="new-challenge">تحدٍ جديد</button><button type="button" class="secondary" data-modal-action="close">إغلاق</button></div>`)}
function renderJourney(){const p=progress();const cards=Object.keys(sections).map(k=>{const total=sections[k].tasks.length,done=sections[k].tasks.filter((_,i)=>state.checked[tkey(k,i)]).length,pct=Math.round(done/total*100);return `<div class="summary-card"><strong>${sections[k].title.replace('أنا ','')}</strong><span>${done} من ${total}</span><div class="meter"><span style="width:${pct}%"></span></div></div>`}).join('');open('رحلتي نحو الانطلاق',`<div class="summary-grid">${cards}</div><div class="summary-card" style="margin-top:10px"><strong>التقدم الكلي</strong><span>${p}%</span><div class="meter"><span style="width:${p}%"></span></div></div><div class="summary-card" style="margin-top:10px"><strong>هدفي</strong><span>${(state.goal||'').trim()?esc(state.goal):'لم يُكتب بعد'}</span></div><div class="badge-award ${p===100?'show':''}">🏅 وسام العودة المميزة — جاهز للانطلاق!</div><div class="action-row"><button type="button" class="secondary" data-modal-action="close">إغلاق</button></div>`)}
function renderCompass(){open('بوصلة الاستعداد',`<p class="subtitle">اختر أحد اتجاهات البوصلة لفتح مهامه.</p><div class="summary-grid">${Object.keys(sections).map(k=>`<button type="button" class="summary-card" data-open-section="${k}" style="text-align:right;cursor:pointer"><strong>${sections[k].title}</strong><span>${sectionDone(k)?'مكتمل ✓':'اضغط للمتابعة'}</span></button>`).join('')}</div><div class="action-row"><button type="button" class="secondary" data-modal-action="close">إغلاق</button></div>`)}
document.querySelectorAll('.hotspot[data-section]').forEach(b=>b.addEventListener('click',()=>renderSection(b.dataset.section)));
document.querySelectorAll('.hotspot[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='goal')renderGoal();if(a==='challenge')renderChallenge();if(a==='journey')renderJourney();if(a==='compass')renderCompass()}));
mb.addEventListener('change',e=>{const cb=e.target.closest('[data-task-key]');if(cb)state.checked[cb.dataset.taskKey]=cb.checked});
mb.addEventListener('click',e=>{const sec=e.target.closest('[data-open-section]');if(sec){renderSection(sec.dataset.openSection);return}const b=e.target.closest('[data-modal-action]');if(!b)return;const a=b.dataset.modalAction;if(a==='close'){dlg.close();return}if(a==='save-tasks'){mb.querySelectorAll('[data-task-key]').forEach(cb=>state.checked[cb.dataset.taskKey]=cb.checked);save();toastMsg('تم حفظ إنجازك ✓');dlg.close();return}if(a==='save-goal'){state.goal=document.getElementById('goalInput').value.trim();save();toastMsg('تم حفظ هدفك ⭐');dlg.close();return}if(a==='challenge-done'){state.challengeDone=!state.challengeDone;save();toastMsg(state.challengeDone?'أحسنت! أُنجز التحدي 🏆':'تم إلغاء علامة الإنجاز');renderChallenge();return}if(a==='new-challenge'){state.challengeIndex=(state.challengeIndex+1)%challenges.length;state.challengeDone=false;save();renderChallenge();return}});
closeBtn.addEventListener('click',()=>dlg.close());dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});resetBtn.addEventListener('click',()=>{if(confirm('هل تريد مسح التقدم والبدء من جديد؟')){state=empty();save();toastMsg('بدأت رحلة جديدة')}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});installBtn.addEventListener('click',async()=>{if(!deferredPrompt){toastMsg('يمكن تثبيت التطبيق بعد رفعه على رابط HTTPS.');return}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));update();
})();
</script></body></html>
